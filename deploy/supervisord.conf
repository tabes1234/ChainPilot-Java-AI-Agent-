[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid

[program:backend]
directory=/app/backend
command=/bin/sh -c "exec java -XX:MaxRAMPercentage=55 -Dfile.encoding=UTF-8 -jar /app/backend/app.jar --spring.profiles.active=h2"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
directory=/app/frontend
environment=NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1",PORT="3000"
command=/bin/sh -c "exec node node_modules/next/dist/bin/next start -p 3000"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
