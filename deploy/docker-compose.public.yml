# Self-hosted / VPS variant that keeps MySQL 8. No ports of MySQL or the backend are
# published; only the frontend (3000) is exposed. Put an HTTPS reverse proxy (Caddy/Nginx)
# in front of it. Set values in deploy/.env (never commit it).
#
#   docker compose -f deploy/docker-compose.public.yml --env-file deploy/.env up -d --build
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      MYSQL_DATABASE: chainpilot
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - chainpilot-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DATA_AGENT_DATASOURCE_URL: jdbc:mysql://mysql:3306/chainpilot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DATA_AGENT_DATASOURCE_USERNAME: root
      DATA_AGENT_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DATA_AGENT_DATASOURCE_SQL_INIT: always
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        CHAINPILOT_BACKEND_URL: http://backend:8065
    environment:
      CHAINPILOT_PUBLIC_DEMO: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chainpilot-mysql:
